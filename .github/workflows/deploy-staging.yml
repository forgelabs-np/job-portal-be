name: Deploy Backend to Staging Server

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /mnt/storage/server/projects/job-portal-be

            git pull origin staging

            docker compose -f /mnt/storage/server/compose/backend.yml down

            docker compose -f /mnt/storage/server/compose/backend.yml up -d --build
